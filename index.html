<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ガチャシミュレーター</title>
  <style>
    :root {
      --bg: #0d1017;
      --panel: #171c28;
      --panel-2: #121620;
      --border: #2c354b;
      --text: #f6f8fc;
      --muted: #9aa6bd;
      --ssr: #ffd43b;
      --ssr-bg: rgba(255, 212, 59, 0.16);
      --sr: #e9ecef;
      --sr-bg: rgba(233, 236, 239, 0.16);
      --r: #d9822b;
      --r-bg: rgba(217, 130, 43, 0.16);
      --accent: #4c8bf5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      max-width: 680px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(13, 16, 23, 0.94);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.97);
    }

    main {
      width: 100%;
      max-width: 680px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .player-row label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .player-row input {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
    }

    .rate-panel {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .rate-main {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 15px;
      font-weight: 800;
    }

    .rate-ssr { color: var(--ssr); }
    .rate-sr  { color: var(--sr); }
    .rate-r   { color: var(--r); }

    .pull-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 12px;
    }

    .pull-btn {
      border: none;
      border-radius: 14px;
      padding: 20px 12px;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .pull-btn:active {
      transform: scale(0.97);
    }

    .pull-1 {
      background: linear-gradient(135deg, #4278e8, #274da3);
      box-shadow: 0 6px 18px rgba(66, 120, 232, 0.28);
    }

    .pull-10 {
      background: linear-gradient(135deg, #f08c00, #c95b0c);
      box-shadow: 0 6px 20px rgba(240, 140, 0, 0.34);
    }

    .pull-caption {
      font-size: 12px;
      font-weight: 700;
      opacity: 0.95;
    }

    .result-inline-box {
      display: none;
      flex-direction: column;
      gap: 12px;
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
    }

    .result-inline-box.active {
      display: flex;
    }

    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .summary-title {
      font-size: 15px;
      font-weight: 800;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .summary-grid.single {
      grid-template-columns: minmax(170px, 240px);
      justify-content: center;
    }

    @media (max-width: 540px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .summary-grid.single {
        grid-template-columns: minmax(180px, 240px);
      }
    }

    .sum-card {
      border-radius: 12px;
      background: var(--panel-2);
      border: 2px solid #35405c;
      padding: 7px;
      min-height: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sum-card.SSR {
      border-color: var(--ssr);
      background: linear-gradient(180deg, rgba(255, 212, 59, 0.16), #121620);
    }

    .sum-card.SR {
      border-color: var(--sr);
      background: linear-gradient(180deg, rgba(233, 236, 239, 0.12), #121620);
    }

    .sum-card.R {
      border-color: var(--r);
      background: linear-gradient(180deg, rgba(217, 130, 43, 0.12), #121620);
    }

    .sum-img {
      width: 100%;
      flex: 1;
      min-height: 155px;
      max-height: 240px;
      object-fit: contain;
      border-radius: 8px;
      background: #0c0f16;
    }

    .sum-label {
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      line-height: 1.3;
      word-break: break-word;
    }

    .gacha-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #05070c;
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gacha-fullscreen.active {
      display: flex;
    }

    .full-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #05070c;
      display: none;
    }

    .full-video.active {
      display: block;
    }

    .skip-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 55;
      background: rgba(15, 20, 32, 0.88);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .single-stage {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 14px;
      cursor: pointer;
      user-select: none;
    }

    .single-stage.active {
      display: flex;
    }

    .step-counter {
      font-size: 14px;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .hero-card {
      width: min(92vw, 440px);
      height: min(74dvh, 620px);
      border-radius: 20px;
      background: #161c2b;
      border: 3px solid #35405c;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      animation: cardPop 0.2s ease-out;
    }

    @keyframes cardPop {
      from { transform: scale(0.94); opacity: 0.45; }
      to { transform: scale(1); opacity: 1; }
    }

    .hero-card.SSR {
      border-color: var(--ssr);
      box-shadow: 0 0 32px rgba(255, 212, 59, 0.52);
      background: linear-gradient(180deg, rgba(255, 212, 59, 0.24), #151924);
    }

    .hero-card.SR {
      border-color: var(--sr);
      box-shadow: 0 0 24px rgba(233, 236, 239, 0.36);
      background: linear-gradient(180deg, rgba(233, 236, 239, 0.16), #151924);
    }

    .hero-card.R {
      border-color: var(--r);
      background: linear-gradient(180deg, rgba(217, 130, 43, 0.16), #151924);
    }

    .hero-img {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: contain;
      border-radius: 12px;
      background: #0c0f16;
    }

    .hero-rarity {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.2;
    }

    .hero-name {
      font-size: 18px;
      font-weight: 900;
      text-align: center;
      line-height: 1.25;
      word-break: break-word;
    }

    .tap-next-hint {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .log-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .log-top h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .sync-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .log-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      background: var(--panel-2);
      border: 1px solid #252d40;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .log-thumb {
      width: 36px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
      background: #0c0f16;
      flex-shrink: 0;
    }

    .log-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .log-line-1 {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .tag {
      font-size: 11px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .tag-SSR {
      color: var(--ssr);
      background: var(--ssr-bg);
      border: 1px solid rgba(255, 212, 59, 0.45);
    }

    .tag-SR {
      color: var(--sr);
      background: var(--sr-bg);
      border: 1px solid rgba(233, 236, 239, 0.45);
    }

    .log-card-name {
      font-weight: 800;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-line-2 {
      font-size: 12px;
      color: var(--text);
      opacity: 0.92;
      padding-left: 2px;
    }

    .log-line-3 {
      font-size: 11px;
      color: var(--muted);
      padding-left: 2px;
    }

    .empty-log {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 18px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>ガチャシミュレーター</h1>
  </header>

  <main>
    <section class="box">
      <div class="player-row">
        <label for="playerName">プレイヤー名</label>
        <input id="playerName" type="text" maxlength="16" placeholder="ゲスト">
      </div>

      <div class="rate-panel">
        <div class="rate-main">
          <span class="rate-ssr">SSR0.9%</span>
          <span class="rate-sr">SR2%</span>
          <span class="rate-r">R97.1%</span>
        </div>
      </div>

      <div class="pull-grid">
        <button class="pull-btn pull-1" id="pull1Btn" type="button">
          <span>1連</span>
          <span class="pull-caption">単発ガチャ</span>
        </button>
        <button class="pull-btn pull-10" id="pull10Btn" type="button">
          <span>10連</span>
          <span class="pull-caption">10連目SR以上確定</span>
        </button>
      </div>
    </section>

    <section class="result-inline-box" id="resultInlineBox">
      <div class="summary-header">
        <span class="summary-title">ガチャ結果</span>
        <button class="btn" id="closeResultBtn" type="button">閉じる</button>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
    </section>

    <section class="box">
      <div class="log-top">
        <h2>SR以上 獲得ログ（最新10件）</h2>
        <span class="sync-badge" id="syncBadge">オンライン同期済み</span>
      </div>
      <ul class="log-list" id="logList"></ul>
    </section>
  </main>

  <div class="gacha-fullscreen" id="gachaFullscreen">
    <button class="skip-btn" id="skipBtn" type="button">スキップ ▶▶</button>
    <video class="full-video" id="gachaVideo" playsinline autoplay></video>

    <div class="single-stage" id="singleStage">
      <div class="step-counter" id="stepCounter">1 / 1</div>
      <div class="hero-card R" id="heroCard"></div>
      <div class="tap-next-hint" id="tapNextHint">画面をタップして結果を見る</div>
    </div>
  </div>

  <script src="./cards.js"></script>
  <script>
    (function () {
      const GAS_URL = "https://script.google.com/macros/s/AKfycbyoj05pCO8gvAJwjL9FZOB67Y4xT1C3QTvvG0gsbf_lH9cvXeq6FTltORZ9vCam-9rT/exec";
      const IMAGE_DIR = "./jpg_cards";
      const VIDEO_DIR = "./videos";

      const EXTERNAL_VIDEOS = {
        SSR: [
          `${VIDEO_DIR}/SSR/My Movie 14.mp4`,
          `${VIDEO_DIR}/SSR/My Movie 15.mp4`,
          `${VIDEO_DIR}/SSR/SSR.mp4`,
          `${VIDEO_DIR}/SSR/ssr.mp4`
        ],
        SR: [
          `${VIDEO_DIR}/SR/My Movie 11.mp4`,
          `${VIDEO_DIR}/SR/My Movie 12.mp4`,
          `${VIDEO_DIR}/SR/My Movie 13.mp4`,
          `${VIDEO_DIR}/SR/SR.mp4`,
          `${VIDEO_DIR}/SR/sr.mp4`
        ],
        R: [
          `${VIDEO_DIR}/R/My Movie 8.mp4`,
          `${VIDEO_DIR}/R/My Movie 9.mp4`,
          `${VIDEO_DIR}/R/My Movie 10.mp4`,
          `${VIDEO_DIR}/R/R.mp4`,
          `${VIDEO_DIR}/R/r.mp4`
        ]
      };

      const FALLBACK_POOL = [
        { rarity: "SSR", name: "SSRサンプル" },
        { rarity: "SR",  name: "SRサンプル" },
        { rarity: "R",   name: "Rサンプル" }
      ];

      let pool = FALLBACK_POOL.slice();
      let poolLoaded = false;
      let logs = [];
      let pulls = [];
      let currentIndex = 0;
      let phase = "idle";
      let videoTimer = null;

      function toNFC(s) {
        return String(s ?? "").normalize("NFC").trim();
      }

      function esc(s) {
        return toNFC(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

            function getCardImageSrc(cardName) {
        const nfdName = String(cardName ?? "").normalize("NFD").trim();
        const dir = toNFC(IMAGE_DIR);
        return `${dir}/${encodeURIComponent(nfdName + ".jpg")}`;
      }


      function formatTime(d) {
        const dt = d instanceof Date ? d : new Date(d);
        if (Number.isNaN(dt.getTime())) return toNFC(d);
        const mm = String(dt.getMonth() + 1).padStart(2, "0");
        const dd = String(dt.getDate()).padStart(2, "0");
        const hh = String(dt.getHours()).padStart(2, "0");
        const mi = String(dt.getMinutes()).padStart(2, "0");
        return `${mm}/${dd} ${hh}:${mi}`;
      }

      function normalizeLogItem(raw) {
        if (!raw || typeof raw !== "object") {
          return { rarity: "SR", cardName: "SRキャラ", playerName: "ゲスト", timestampText: "", ts: 0 };
        }
        const rarity = raw.rarity === "SSR" ? "SSR" : "SR";
        let cardName = toNFC(raw.cardName);
        let playerName = toNFC(raw.playerName) || "ゲスト";
        let timeStr = toNFC(raw.timestampText);

        if (/GMT[+-]\d{4}|日本標準時|Invalid Date/i.test(cardName)) {
          if (!timeStr) timeStr = formatTime(cardName);
          cardName = "SRキャラ";
        }
        if (!cardName) cardName = `${rarity}カード`;
        if (timeStr && /GMT[+-]\d{4}|日本標準時/i.test(timeStr)) {
          timeStr = formatTime(timeStr);
        }

        return {
          rarity,
          cardName,
          playerName,
          timestampText: timeStr,
          ts: Number(raw.ts) || 0
        };
      }

      function renderLogs() {
        const ul = document.getElementById("logList");
        if (!ul) return;
        ul.innerHTML = "";
        if (!logs.length) {
          ul.innerHTML = `<li class="empty-log">SR以上の獲得ログはまだありません</li>`;
          return;
        }
        logs.slice(0, 10).forEach((raw) => {
          const item = normalizeLogItem(raw);
          const thumbSrc = getCardImageSrc(item.cardName);
          const li = document.createElement("li");
          li.className = "log-item";
          li.innerHTML = `
            <img class="log-thumb" src="${thumbSrc}" alt="${esc(item.cardName)}" onerror="this.style.visibility='hidden'">
            <div class="log-body">
              <div class="log-line-1">
                <span class="tag tag-${item.rarity}">${item.rarity}</span>
                <span class="log-card-name">${esc(item.cardName)}</span>
              </div>
              <div class="log-line-2">${esc(item.playerName)}さんがGET!!</div>
              <div class="log-line-3">${esc(item.timestampText)}</div>
            </div>
          `;
          ul.appendChild(li);
        });
      }

      function fetchWithTimeout(url, options, ms) {
        return new Promise((resolve, reject) => {
          const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
          const timer = setTimeout(() => {
            if (ctrl) ctrl.abort();
            reject(new Error("timeout"));
          }, ms || 4000);

          fetch(url, Object.assign({}, options || {}, ctrl ? { signal: ctrl.signal } : {}))
            .then((res) => {
              clearTimeout(timer);
              resolve(res);
            })
            .catch((err) => {
              clearTimeout(timer);
              reject(err);
            });
        });
      }

      function parsePoolList(list) {
        if (!Array.isArray(list)) return [];
        const out = [];
        for (let i = 0; i < list.length; i++) {
          const item = list[i];
          if (!item) continue;
          const rarity = toNFC(item.rarity).toUpperCase();
          const name = toNFC(item.name);
          if ((rarity === "SSR" || rarity === "SR" || rarity === "R") && name) {
            out.push({ rarity, name });
          }
        }
        return out;
      }

      function applyJsFallbackPool() {
        if (Array.isArray(window.GACHA_CARDS)) {
          const parsedJs = parsePoolList(window.GACHA_CARDS);
          if (parsedJs.length > 0) {
            pool = parsedJs;
          }
        }
      }

      async function loadExternalPool() {
        applyJsFallbackPool();
        try {
          const res = await fetchWithTimeout(`./cards.json?t=${Date.now()}`, { method: "GET" }, 4000);
          if (res.ok) {
            const data = await res.json();
            const rawList = Array.isArray(data) ? data : (Array.isArray(data.pool) ? data.pool : []);
            const parsed = parsePoolList(rawList);
            if (parsed.length > 0) {
              pool = parsed;
            }
          }
        } catch {}
        poolLoaded = true;
      }

      function pullLogs() {
        const badge = document.getElementById("syncBadge");
        if (!GAS_URL) {
          if (badge) badge.textContent = "ローカル表示";
          return;
        }
        if (badge) badge.textContent = "同期中...";
        fetchWithTimeout(GAS_URL, { method: "GET" }, 3500)
          .then((res) => res.json())
          .then((data) => {
            if (Array.isArray(data)) {
              logs = data.map(normalizeLogItem).slice(0, 10);
              try { localStorage.setItem("gacha_logs_v6", JSON.stringify(logs)); } catch {}
              renderLogs();
              if (badge) badge.textContent = "オンライン同期済み";
            }
          })
          .catch(() => {
            if (badge) badge.textContent = "キャッシュ表示";
          });
      }

      function sendLog(entry) {
        if (!GAS_URL) return;
        fetchWithTimeout(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(entry)
        }, 3500).catch(() => {});
      }

      function pickCard(srPlusOnly) {
        const ssr = pool.filter(x => x.rarity === "SSR");
        const sr = pool.filter(x => x.rarity === "SR");
        const r = pool.filter(x => x.rarity === "R");

        let rarity = "R";
        if (srPlusOnly) {
          rarity = (Math.random() * 100 < 0.9 && ssr.length) ? "SSR" : "SR";
        } else {
          const roll = Math.random() * 100;
          if (roll < 0.9 && ssr.length) rarity = "SSR";
          else if (roll < 2.9 && sr.length) rarity = "SR";
          else rarity = "R";
        }

        const list = rarity === "SSR" ? ssr : (rarity === "SR" ? sr : r);
        const target = list.length ? list : pool;
        return target[Math.floor(Math.random() * target.length)];
      }

      function getHighestRarity(items) {
        if (items.some(c => c.rarity === "SSR")) return "SSR";
        if (items.some(c => c.rarity === "SR")) return "SR";
        return "R";
      }

      async function runPull(count) {
        if (!poolLoaded) {
          await loadExternalPool();
        }

        const nameInput = document.getElementById("playerName");
        const name = toNFC(nameInput && nameInput.value) || "ゲスト";
        try { localStorage.setItem("gacha_player_v6", name); } catch {}

        pulls = [];
        for (let i = 0; i < count; i++) {
          pulls.push(pickCard(count === 10 && i === 9));
        }

        const srOrBetter = pulls.filter(c => c.rarity === "SR" || c.rarity === "SSR");
        if (srOrBetter.length > 0) {
          const tsText = formatTime(new Date());
          for (let i = 0; i < srOrBetter.length; i++) {
            const c = srOrBetter[i];
            const entry = {
              rarity: c.rarity,
              cardName: toNFC(c.name),
              playerName: name,
              timestampText: tsText,
              ts: Date.now()
            };
            logs.unshift(entry);
            logs = logs.slice(0, 10);
            sendLog(entry);
          }
          try { localStorage.setItem("gacha_logs_v6", JSON.stringify(logs)); } catch {}
          renderLogs();
        }

        startFullscreenGacha();
      }

      function stopVideo() {
        clearTimeout(videoTimer);
        const video = document.getElementById("gachaVideo");
        if (video) {
          video.onended = null;
          video.onerror = null;
          try {
            video.pause();
            video.removeAttribute("src");
            video.load();
          } catch {}
          video.classList.remove("active");
        }
      }

           function playCandidateVideo(video, candidates, idx) {
        if (!video || idx >= candidates.length) {
          enterSingleFullscreen();
          return;
        }
        const src = encodeURI(toNFC(candidates[idx]));
        video.classList.add("active");
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.src = src;
        video.currentTime = 0;

        video.onerror = () => {
          playCandidateVideo(video, candidates, idx + 1);
        };
        video.onended = () => {
          enterSingleFullscreen();
        };

        video.muted = false;
        const p = video.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => {
            video.muted = true;
            video.play().catch(() => {
              playCandidateVideo(video, candidates, idx + 1);
            });
          });
        }
      }


      function startFullscreenGacha() {
        const fs = document.getElementById("gachaFullscreen");
        const video = document.getElementById("gachaVideo");
        const singleStage = document.getElementById("singleStage");
        const highest = getHighestRarity(pulls);
        const rawList = EXTERNAL_VIDEOS[highest] || EXTERNAL_VIDEOS.R || [];
        const shuffled = rawList.slice().sort(() => Math.random() - 0.5);

        document.getElementById("resultInlineBox").classList.remove("active");
        fs.classList.add("active");
        singleStage.classList.remove("active");
        clearTimeout(videoTimer);

        if (video && shuffled.length > 0) {
          phase = "video";
          playCandidateVideo(video, shuffled, 0);
        } else {
          enterSingleFullscreen();
        }
      }

      function enterSingleFullscreen() {
        stopVideo();
        phase = "single";
        currentIndex = 0;

        const fs = document.getElementById("gachaFullscreen");
        const singleStage = document.getElementById("singleStage");
        fs.classList.add("active");
        singleStage.classList.add("active");
        renderSingleCard();
      }

      function renderSingleCard() {
        const card = pulls[currentIndex];
        if (!card) return;

        const counter = document.getElementById("stepCounter");
        const hero = document.getElementById("heroCard");
        const hint = document.getElementById("tapNextHint");

        counter.textContent = pulls.length > 1 ? `${currentIndex + 1} / ${pulls.length}` : "1 / 1";
        hero.className = `hero-card ${card.rarity}`;

        hero.style.animation = "none";
        void hero.offsetWidth;
        hero.style.animation = "";

        const imgSrc = getCardImageSrc(card.name);
        const colorVar = `var(--${card.rarity.toLowerCase()})`;

        hero.innerHTML = `
          <img class="hero-img" src="${imgSrc}" alt="${esc(card.name)}">
          <div class="hero-rarity" style="color:${colorVar}">${card.rarity}</div>
          <div class="hero-name" style="color:${colorVar}">${esc(card.name)}</div>
        `;

        hint.textContent = currentIndex < pulls.length - 1
          ? "画面をタップして次のカードへ"
          : "画面をタップして結果を見る";
      }

      function advanceSingle() {
        if (phase !== "single") return;
        if (currentIndex < pulls.length - 1) {
          currentIndex++;
          renderSingleCard();
        } else {
          finishToHomeAndShowResults();
        }
      }

      function finishToHomeAndShowResults() {
        stopVideo();
        phase = "idle";
        document.getElementById("singleStage").classList.remove("active");
        document.getElementById("gachaFullscreen").classList.remove("active");

        const inlineBox = document.getElementById("resultInlineBox");
        const grid = document.getElementById("summaryGrid");
        inlineBox.classList.add("active");
        grid.className = pulls.length === 1 ? "summary-grid single" : "summary-grid";
        grid.innerHTML = "";

        pulls.forEach((card) => {
          const imgSrc = getCardImageSrc(card.name);
          const colorVar = `var(--${card.rarity.toLowerCase()})`;
          const el = document.createElement("div");
          el.className = `sum-card ${card.rarity}`;
          el.innerHTML = `
            <img class="sum-img" src="${imgSrc}" alt="${esc(card.name)}">
            <div class="sum-label" style="color:${colorVar}">[${card.rarity}] ${esc(card.name)}</div>
          `;
          grid.appendChild(el);
        });

        inlineBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
        pullLogs();
      }

      try {
        const savedName = localStorage.getItem("gacha_player_v6");
        if (savedName) document.getElementById("playerName").value = toNFC(savedName);
      } catch {}

      try {
        const cached = JSON.parse(localStorage.getItem("gacha_logs_v6") || "[]");
        if (Array.isArray(cached)) logs = cached.map(normalizeLogItem).slice(0, 10);
      } catch {}

      renderLogs();
      loadExternalPool();
      pullLogs();

      document.getElementById("pull1Btn").onclick = () => runPull(1);
      document.getElementById("pull10Btn").onclick = () => runPull(10);
      document.getElementById("singleStage").onclick = () => advanceSingle();

      document.getElementById("skipBtn").onclick = (e) => {
        e.stopPropagation();
        if (phase === "video") {
          enterSingleFullscreen();
        } else {
          finishToHomeAndShowResults();
        }
      };

      document.getElementById("closeResultBtn").onclick = () => {
        document.getElementById("resultInlineBox").classList.remove("active");
      };
    })();
  </script>
</body>
</html>
